# ============================================================
# CGI 242 - Docker Compose Production (Serveur seul)
# ============================================================
# Les services postgres, redis, qdrant et nginx tournent deja
# sur le VPS hote. Ce fichier ne gere que le serveur Node.js.
#
# Usage:
#   docker compose -f docker-compose.server.yml up -d --build
#   docker compose -f docker-compose.server.yml logs -f
# ============================================================

services:
  server:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.server
    container_name: cgi-242-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # URLs internes Docker (remplacent localhost)
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://cgi-redis:6379"
      QDRANT_URL: "http://cgi-qdrant:6333"
      FRONTEND_URL: "https://cgi242.normx-ai.com"
      NODE_OPTIONS: "--max-old-space-size=384"
    networks:
      - cgi-network
    volumes:
      - server_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  cgi-network:
    external: true

volumes:
  server_logs:
